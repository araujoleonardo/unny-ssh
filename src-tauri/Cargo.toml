[package]
name = "unny-ssh"
version = "0.1.0"
description = "Workspace SSH com terminal, SFTP e gerenciamento Docker."
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "unny_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
fs2 = "0.4"
atomicwrites = "0.4"
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "=3.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros", "fs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
sha2 = "0.10"
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
rand10 = { version = "0.10", package = "rand" }
tempfile = "3"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }
