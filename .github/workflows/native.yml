name: Native validation
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev libwayland-dev openssh-server openssh-client
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - if: runner.os == 'Linux'
        run: sudo mkdir -p /run/sshd
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          bash tests/fixtures/ssh/run-native.sh
          bash tests/fixtures/ssh/run-native.sh --files
      - run: npm run tauri build -- --debug --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            src-tauri/target/debug/unny-ssh
            src-tauri/target/debug/unny-ssh.exe
# This validates compilation and services. WebView interaction/CSP remains a
# native smoke checklist; a green job is not a desktop UI acceptance result.
