name: Windows release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(tag)) {
            throw new Error('Use uma tag vMAJOR.MINOR.PATCH ou vMAJOR.MINOR.PATCH-prerelease.');
          }
          const version = tag.slice(1);
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          const versions = [
            read('package.json').version,
            read('package-lock.json').version,
            read('package-lock.json').packages[''].version,
            read('src-tauri/tauri.conf.json').version,
            cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1],
          ];
          if (versions.some(value => value !== version)) {
            throw new Error(`A tag ${tag} deve coincidir com as versões npm, lockfile, Cargo e Tauri.`);
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows x64 installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-installer
          path: installers
      - name: Publish installer to GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = context.ref.replace('refs/tags/', '');
            const files = fs.readdirSync('installers').filter(name => name.endsWith('-setup.exe'));
            if (files.length !== 1) throw new Error('Esperado exatamente um instalador Windows x64.');
            const { owner, repo } = context.repo;
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: `unny-ssh ${tag}`,
                draft: true, prerelease: tag.includes('-'), generate_release_notes: true,
              })).data;
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id: release.id, per_page: 100,
            });
            for (const name of files) {
              const existing = assets.find(asset => asset.name === name);
              if (existing) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name,
                data: fs.readFileSync(path.join('installers', name)),
                headers: { 'content-type': 'application/octet-stream' },
              });
            }
            if (release.draft) await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false,
            });
            core.notice(`Instalador publicado em ${release.html_url}`);
